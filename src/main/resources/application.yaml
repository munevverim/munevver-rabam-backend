server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/rabam_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: rabam_user
    password: rabam_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
