server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/rabam_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: rabam_user
    password: rabam_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: rabam
    password: rabam

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  rabbitmq:
    exchange: rabam.events.exchange
    audit-queue: rabam.audit.queue
    audit-routing-key: rabam.audit.event

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha