services:
  mysql:
    image: mysql:8.0
    container_name: rabam-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rabam_db
      MYSQL_USER: rabam_user
      MYSQL_PASSWORD: rabam_pass
    ports:
      - "3333:3306"
    volumes:
      - rabam_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabam-rabbitmq
    restart: always
    ports:
      - "5683:5672"
      - "15683:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabam
      RABBITMQ_DEFAULT_PASS: rabam
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rabam-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rabam-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  rabam_mysql_data: